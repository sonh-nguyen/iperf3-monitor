# Single entry point that fronts all UIs under one port, each on its own
# path. proxy_pass has no URI component on any of these, so nginx forwards
# the original request path unchanged — matching what each upstream expects:
# Prometheus/Alertmanager are told about their prefix via --web.route-prefix,
# and Grafana via GF_SERVER_SERVE_FROM_SUB_PATH, so all three need to see the
# prefix in the incoming path rather than have it stripped.
server {
    listen 80;

    location / {
        proxy_pass http://targets-admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /alertmanager/ {
        proxy_pass http://alertmanager:9093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Grafana Live (websocket) needs the Upgrade/Connection headers below.
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
