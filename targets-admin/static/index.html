<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iperf3-monitor · Targets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #8884; }
  nav a { color: inherit; text-decoration: none; font-size: 0.9rem; opacity: 0.7; }
  nav a:hover { opacity: 1; text-decoration: underline; }
  nav a.active { opacity: 1; font-weight: 600; }
  h1 { font-size: 1.4rem; }
  p.hint { color: #888; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8884; }
  form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
  label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.25rem; flex-shrink: 0; }
  input { padding: 0.4rem; border: 1px solid #8886; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
  input[name="name"], input[name="host"] { width: 10rem; }
  input[name="port"], input[name="period"], input[name="interval"], input[name="streams"] { width: 5.5rem; }
  button { padding: 0.45rem 0.9rem; border: none; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; font-size: 0.9rem; }
  button.danger { background: #dc2626; }
  button.secondary { background: #64748b; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { min-height: 1.2rem; font-size: 0.85rem; }
  #status.error { color: #dc2626; }
  #status.ok { color: #16a34a; }
  .empty { color: #888; font-style: italic; }
</style>
</head>
<body>
<nav>
  <a href="/" class="active">Targets</a>
  <a href="/grafana/" target="_blank" rel="noopener">Grafana</a>
  <a href="/prometheus/" target="_blank" rel="noopener">Prometheus</a>
  <a href="/alertmanager/" target="_blank" rel="noopener">Alertmanager</a>
</nav>
<h1>iperf3-monitor · iperf server list</h1>
<p class="hint">Add/remove targets here — Prometheus automatically picks up changes within 30 seconds, no restart needed.</p>

<form id="add-form">
  <label>Name
    <input name="name" required placeholder="e.g. hn-server" maxlength="63">
  </label>
  <label>Host (IP or domain)
    <input name="host" required placeholder="e.g. 1.2.3.4">
  </label>
  <label>Port
    <input name="port" type="number" min="1" max="65535" placeholder="5201">
  </label>
  <label>Test duration (s)
    <input name="period" type="number" min="1" max="20" placeholder="5">
  </label>
  <label>Scrape interval (s)
    <input name="interval" type="number" min="60" max="3600" placeholder="60">
  </label>
  <label>Streams
    <input name="streams" type="number" min="1" max="64" placeholder="1">
  </label>
  <button type="button" class="secondary" id="test-btn">Test connection</button>
  <button type="submit">Add</button>
</form>

<div id="status"></div>

<table>
  <thead><tr><th>Name</th><th>Host</th><th>Port</th><th>Test duration (s)</th><th>Scrape interval (s)</th><th>Streams</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const rowsEl = document.getElementById('rows');
const statusEl = document.getElementById('status');
const form = document.getElementById('add-form');
const testBtn = document.getElementById('test-btn');

function setStatus(msg, kind) {
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', kind === 'error');
  statusEl.classList.toggle('ok', kind === 'ok');
}

async function load() {
  setStatus('Loading...');
  try {
    const res = await fetch('/api/targets');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
    setStatus('');
  } catch (err) {
    setStatus('Failed to load list: ' + err.message, 'error');
  }
}

function render(targets) {
  rowsEl.innerHTML = '';
  if (!targets || targets.length === 0) {
    rowsEl.innerHTML = '<tr><td colspan="7" class="empty">No targets yet</td></tr>';
    return;
  }
  for (const t of targets) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td></td><td></td><td></td><td></td><td></td><td></td><td><button class="danger">Delete</button></td>';
    tr.children[0].textContent = t.name;
    tr.children[1].textContent = t.host;
    tr.children[2].textContent = t.port;
    tr.children[3].textContent = t.period + 's';
    tr.children[4].textContent = t.interval + 's';
    tr.children[5].textContent = t.streams;
    tr.children[6].querySelector('button').addEventListener('click', () => removeTarget(t.name));
    rowsEl.appendChild(tr);
  }
}

async function removeTarget(name) {
  if (!confirm('Delete target "' + name + '"?')) return;
  try {
    const res = await fetch('/api/targets/' + encodeURIComponent(name), { method: 'DELETE' });
    if (!res.ok && res.status !== 204) throw new Error('HTTP ' + res.status);
    await load();
  } catch (err) {
    setStatus('Failed to delete: ' + err.message, 'error');
  }
}

testBtn.addEventListener('click', async () => {
  const host = form.elements.host.value.trim();
  const port = form.elements.port.value ? Number(form.elements.port.value) : 0;
  if (!host) {
    setStatus('Enter a host first.', 'error');
    return;
  }
  testBtn.disabled = true;
  setStatus('Testing connection...');
  try {
    const res = await fetch('/api/test-target', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host, port }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    if (body.ok) {
      setStatus('Reachable (' + body.latencyMs + ' ms)', 'ok');
    } else {
      setStatus('Not reachable: ' + body.error, 'error');
    }
  } catch (err) {
    setStatus('Test failed: ' + err.message, 'error');
  } finally {
    testBtn.disabled = false;
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  const payload = {
    name: data.name,
    host: data.host,
    port: data.port ? Number(data.port) : 0,
    period: data.period ? Number(data.period) : 0,
    interval: data.interval ? Number(data.interval) : 0,
    streams: data.streams ? Number(data.streams) : 0,
  };
  setStatus('Saving...');
  try {
    const res = await fetch('/api/targets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    form.reset();
    await load();
  } catch (err) {
    setStatus('Failed to add: ' + err.message, 'error');
  }
});

load();
</script>
</body>
</html>
